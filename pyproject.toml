[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelset-s2pinn"
version = "0.1.0"
description = "Wheelset bearing support stiffness from multi-pass axle-box acceleration: debiased Whittle likelihood (MSSP paper code)"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "pyyaml==6.0.1",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
