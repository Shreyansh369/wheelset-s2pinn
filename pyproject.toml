[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelset-s2pinn"
version = "0.1.0"
description = "Stochastic separable PINN for wheelset bearing-support identification (parent paper)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "numpy",
  "scipy",
  "matplotlib",
  "pyyaml",
  "chaospy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
