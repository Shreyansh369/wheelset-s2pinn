# L1-lin reference model parameters.
# Every entry: value, unit, source. "placeholder" = typical published range, not a specific
# vehicle; replace from drawings or datasheets (wheelset document §16-17) before any claim
# about a real vehicle.

material:
  E:      {value: 2.10e11, unit: Pa,      source: "doc §16 (standard steel)"}
  nu:     {value: 0.30,    unit: "-",     source: "doc §16"}
  rho:    {value: 7850.0,  unit: kg/m^3,  source: "doc §16"}
  kappa:  {value: null,    unit: "-",     source: "Cowper circular section 6(1+nu)/(7+6nu), computed"}

axle:   # symmetric about xi = 0; sections listed outward from the centre (half axle)
  length:       {value: 2.180, unit: m, source: "placeholder: typical standard-gauge freight axle"}
  sections:     # [outer |xi| end, diameter]
    value: [[0.640, 0.175], [0.860, 0.200], [0.900, 0.160], [1.090, 0.130]]
    unit: [m, m]
    source: "placeholder: body / wheel seat / dust-guard collar / journal, typical EN 13103-type proportions"
  wheel_xi:     {value: 0.750, unit: m, source: "placeholder: contact plane ~ half of 1.5 m contact-point spacing"}
  journal_xi:   {value: 0.995, unit: m, source: "placeholder: mid-journal bearing centre"}
  n_elements:   {value: 32,    unit: "-", source: "brief: 20-40 elements; convergence checked at 20/30/40"}
  damping_zeta: {value: 0.01,  unit: "-", source: "placeholder: 1% stiffness-proportional at f_ref"}
  damping_fref: {value: 80.0,  unit: Hz,  source: "placeholder: typical first wheelset bending frequency"}

wheel:
  mass:              {value: 350.0, unit: kg,     source: "placeholder: 920 mm freight wheel"}
  diametral_inertia: {value: 20.0,  unit: kg m^2, source: "placeholder: disc estimate m r^2/4 with rim correction"}
  r0:                {value: 0.4575, unit: m,     source: "doc §13 (new 915 mm wheel)"}

bearing:   # journal -> axlebox spring-damper; health parameters theta
  kB0:       {value: 1.0e9, unit: N/m,   source: "placeholder: tapered roller unit radial stiffness, order 1e8-1e9"}
  cB:        {value: 5.0e3, unit: N s/m, source: "placeholder: EHL/structural damping"}
  prior_log_halfwidth: {value: 0.6931471805599453, unit: "-", source: "placeholder: factor-2 prior on kB0 and cB (log-uniform)"}
  load_exponent: {value: 0.1, unit: "-", source: "doc Eq. (12): Q ~ delta^(10/9) gives k ~ Q^(1/10)"}
  support_law:   {value: linear, unit: "-", source: "switch: linear | clearance | roller_contact (non-smooth laws: time domain only, not yet implemented)"}

axlebox:
  mass: {value: 60.0, unit: kg, source: "placeholder: housing + outer ring + adapter"}

primary:   # axlebox -> fixed bogie frame (Zener element dropped)
  kp: {value: 1.0e6, unit: N/m,   source: "placeholder: freight primary vertical stiffness per axlebox"}
  cp: {value: 1.0e4, unit: N s/m, source: "placeholder: equivalent linear damping per axlebox"}

payload:   # axle load W, uniform per pass; enters only through kB = kB0 (W/W0)^(1/10)
  W_min: {value: 5.5,  unit: t, source: "placeholder: empty freight wagon axle load"}
  W_max: {value: 22.5, unit: t, source: "placeholder: loaded (22.5 t axle load class)"}
  W0:    {value: 22.5, unit: t, source: "reference load for kB0 (loaded)"}

operation:
  V: {value: 27.7777777778, unit: m/s, source: "doc §13: 100 km/h, constant and known for all passes (assumption A5)"}

forcing:
  oor_orders:    {value: [1, 2, 3], unit: "-", source: "brief: wheel out-of-roundness orders 1-3 (doc Eq. 7)"}
  oor_std:       {value: [1.0e-4, 5.0e-5, 3.0e-5], unit: m, source: "placeholder: std of a_n, b_n (eccentricity ~0.1 mm)"}
  oor_same_both_wheels: {value: true, unit: "-", source: "decision D9: one shared set, same phase"}
  track_spectrum:   # German spectrum S_v = A_v Omega_c^2 / ((Omega^2+Omega_r^2)(Omega^2+Omega_c^2)), doc Eq. (26)
    A_v:     {value: 4.032e-7, unit: m rad,  source: "published German low-irregularity coefficients (e.g. Zhai 2020, doc ref 9); verify; route fit recommended"}
    Omega_c: {value: 0.8246,   unit: rad/m, source: "as A_v"}
    Omega_r: {value: 0.0206,   unit: rad/m, source: "as A_v"}
  track_wavelengths: {value: [25.0, 10.0, 4.0, 1.5], unit: m, source: "placeholder: 4 wavelengths in band, away from wheel orders at 100 km/h"}
  track_form: {value: gaussian, unit: "-", source: "brief: sqrt(S dOmega)(A cos + B sin), A,B ~ N(0,1); dOmega = log-bin width"}
  same_profile_both_rails: {value: true, unit: "-", source: "assumption A8: no cross-level"}

rail_sdof:   # optional: one oscillator per wheel under quasi-static rigid contact
  enabled: {value: false, unit: "-", source: "brief: rigid track default"}
  m_r: {value: 150.0, unit: kg,    source: "placeholder: effective rail+sleeper mass per wheel"}
  k_r: {value: 1.0e8, unit: N/m,   source: "placeholder: track support stiffness per wheel"}
  c_r: {value: 1.0e5, unit: N s/m, source: "placeholder"}

sensor:
  location:  {value: axlebox_left, unit: "-", source: "assumption A10"}
  h_s:       {value: identity, unit: "-", source: "brief"}
  snr_db:    {value: [20, 40], unit: dB, source: "brief"}
  n_revs:    {value: 20, unit: "-", source: "placeholder: record length in wheel revolutions"}
  fs:        {value: 1000.0, unit: Hz, source: "placeholder: sampling rate (band <= 150 Hz)"}
  band_max:  {value: 150.0, unit: Hz, source: "brief"}

inverse:
  targets: {value: [log_kB0, log_cB], unit: "-", source: "brief; configurable (Child A hook)"}
