# Configuration and estimator behind every result file used by a table, figure or macro of the paper.
# config: frozen  = config/params.yaml + config/track.yaml as frozen (hash checked by make_provenance_check.py)
#         pinned  = config/snapshots/headline_freight_v1 (frozen wagon, but k_H0 1.4 GN/m, c_p 10 kN s/m)
#         earlier = an earlier configuration or a different setup; anything that uses it must say so
#                   ("earlier configuration") in the caption or paragraph
#         sensitivity = an override of the frozen config (config_dir, its own hash, checked); a sensitivity
#                   study, labelled "sensitivity" in the caption or paragraph that uses it
# Files written after the hash was introduced carry provenance.config_hash / estimator_version, which the
# check compares with this declaration. Older files are classified here from their run date against the
# last configuration change (2026-10-15 22:33 UTC) and the setup recorded in their "config" block.
frozen_estimator: "multipass-whittle-2 (debiased, Kb=120 default, own-sub-band scoring, 0.5 Hz table)"
labels:
  earlier: "earlier configuration"
  pinned: "pinned headline configuration"
  sensitivity: "sensitivity"
files:
  config/params.yaml: {config: frozen}
  config/track.yaml: {config: frozen}
  experiments/p1_fe_direct.py: {config: frozen, estimator: none, setup: "simulation truth and start (TRUTH, START), WIM, payload range"}
  results/p1/verification.json: {config: frozen, estimator: none, v2: "rerun at the final regeneration (FE verification, minutes)"}
  results/gates/G1.json: {config: frozen, estimator: none, v2: "rerun at the final regeneration (gate report)"}
